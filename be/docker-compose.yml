services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ice-tea-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - ice-tea-network

  web:
    image: nginx:alpine
    container_name: ice-tea-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - ice-tea-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: ice-tea-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - ice-tea-network

  redis:
    image: redis:alpine
    container_name: ice-tea-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - ice-tea-network

networks:
  ice-tea-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  redisdata:
    driver: local
