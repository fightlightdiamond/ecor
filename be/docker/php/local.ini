upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 512M
max_execution_time = 600

; --- Tối ưu cho WSL2 (mount filesystem chậm) ---
; OPcache: cache bytecode trong RAM, giảm đọc/biên dịch file mỗi request
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; realpath cache: giảm số lần stat() file (Laravel gọi rất nhiều) -> tăng tốc rõ rệt trên mount 9p
realpath_cache_size = 8M
realpath_cache_ttl = 600
