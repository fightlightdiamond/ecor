# =============================================================================
# admin-medusa — full development stack (all services in containers)
# =============================================================================
# Runs everything in Docker (Postgres, Medusa backend, Next.js storefront) with
# source mounted for hot-reload. node_modules / build caches live in NAMED
# VOLUMES (ext4) instead of the bind mount, so they are fast and don't collide
# with the Windows-built node_modules on /mnt/d.
#
# No Redis: @medusajs/event-bus-redis reproducibly hung server boot forever in
# this WSL2/Docker environment, and cache/locking/workflow-engine gain little
# for a single-instance dev stack. Medusa runs fully in-memory (same as the
# native run-dev.sh / run-dev.ps1 scripts).
#
# The project is bind-mounted at /workspace (NOT /app) inside every container.
# Medusa's admin dashboard is served at the URL path /app (localhost:9000/app),
# and Vite's dev-server import resolution strips a leading path segment that
# matches its configured `base`. If the container's filesystem root were also
# named /app, an admin route/i18n virtual module's absolute import path
# (e.g. /app/apps/backend/src/admin/i18n/index.ts) would collide with that
# `base` stripping and silently corrupt into "apps/backend/src/admin/i18n/index.ts",
# which then fails to resolve ("Failed to resolve import ... Does the file
# exist?") even though the file is right there. Mounting at /workspace avoids
# the collision entirely.
#
# Run this INSIDE WSL (where Docker lives):
#   cd /mnt/d/01.WORKS/WWW/Thang_long_che_viet_project/apps/admin-medusa
#   cp .env.example .env         # then edit if needed
#
#   # Phase 1 — DB + backend (admin dashboard):
#   docker compose up -d
#   # -> open http://localhost:9000/app  (admin@medusa.local / supersecret123)
#   # -> Settings > Publishable API keys > copy the key into .env as
#   #    NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY
#
#   # Phase 2 — storefront (needs the publishable key above):
#   docker compose --profile storefront up -d
#   # -> open http://localhost:8000
#
# The storefront is behind a compose PROFILE so `up` doesn't start it before the
# publishable key exists (it would crash-loop otherwise — see check-env-variables.js).
#
# NOTE: backend host port is fixed at 9000 on purpose. The storefront SDK uses a
# single URL (NEXT_PUBLIC_MEDUSA_BACKEND_URL) for both browser and SSR, so the
# storefront shares the backend's network namespace (localhost:9000 works from
# both the browser via the published port and from SSR inside the container).
# =============================================================================

name: admin-medusa

services:
  # --- PostgreSQL ------------------------------------------------------------
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-medusa}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-medusa}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # --- One-shot dependency install (populates the node_modules volumes) -------
  install:
    image: node:20
    working_dir: /workspace
    command: sh -c "npm install --no-audit --no-fund"
    volumes:
      - ./:/workspace
      - root_node_modules:/workspace/node_modules
      - backend_node_modules:/workspace/apps/backend/node_modules
      - storefront_node_modules:/workspace/apps/storefront/node_modules
    restart: "no"

  # --- Medusa backend (API + admin dashboard at /app) -------------------------
  backend:
    image: node:20
    working_dir: /workspace/apps/backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      install:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-medusa}
      STORE_CORS: ${STORE_CORS:-http://localhost:8000}
      ADMIN_CORS: ${ADMIN_CORS:-http://localhost:9000,http://localhost:5173}
      AUTH_CORS: ${AUTH_CORS:-http://localhost:9000,http://localhost:8000,http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-supersecret}
      COOKIE_SECRET: ${COOKIE_SECRET:-supersecret}
      # Poll the filesystem so hot-reload works over the WSL/Windows bind mount.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    ports:
      # Backend API + admin. Storefront's port is published here too because the
      # storefront shares this container's network namespace (see below).
      - "9000:9000"
      - "${STOREFRONT_PORT:-8000}:8000"
    volumes:
      - ./:/workspace
      - root_node_modules:/workspace/node_modules
      - backend_node_modules:/workspace/apps/backend/node_modules
      - backend_medusa:/workspace/apps/backend/.medusa
    command: >
      sh -c "npx medusa db:migrate &&
             (npx medusa user -e ${ADMIN_EMAIL:-admin@medusa.local} -p ${ADMIN_PASSWORD:-supersecret123} || true) &&
             npx medusa develop"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s

  # --- Next.js storefront (profile: storefront) ------------------------------
  storefront:
    image: node:20
    working_dir: /workspace/apps/storefront
    restart: unless-stopped
    profiles: ["storefront"]
    # Share the backend's network stack so NEXT_PUBLIC_MEDUSA_BACKEND_URL
    # (http://localhost:9000) resolves to the backend from BOTH the browser
    # (via the published port on the backend service) and SSR in this container.
    network_mode: "service:backend"
    depends_on:
      backend:
        condition: service_healthy
      install:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-}
      NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-dk}
      NEXT_PUBLIC_BASE_URL: http://localhost:${STOREFRONT_PORT:-8000}
      NEXT_PUBLIC_STRIPE_KEY: ${NEXT_PUBLIC_STRIPE_KEY:-}
      # Poll for changes (bind mount over 9p doesn't emit inotify events).
      WATCHPACK_POLLING: "true"
    volumes:
      - ./:/workspace
      - root_node_modules:/workspace/node_modules
      - storefront_node_modules:/workspace/apps/storefront/node_modules
      - storefront_next:/workspace/apps/storefront/.next
    # Plain (webpack) dev server, not turbopack: respects WATCHPACK_POLLING and
    # binds all interfaces so the shared-namespace published port is reachable.
    command: sh -c "npx next dev -p 8000 -H 0.0.0.0"

volumes:
  postgres_data:
  root_node_modules:
  backend_node_modules:
  storefront_node_modules:
  backend_medusa:
  storefront_next:
