version: '3.9'

services:
  # ==========================================
  # Frontend (Nuxt)
  # ==========================================
  web:
    image: node:20.19-alpine
    container_name: tl_che_viet_web
    working_dir: /home/app
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/home/app
      - node_modules:/home/app/node_modules
    environment:
      - NODE_ENV=development
      - NPM_CONFIG_LOGLEVEL=info
      - NUXT_API_PROXY_TARGET=http://nginx:80
      - NUXT_PUBLIC_SITE_URL=http://localhost:3000
    command: sh -c "npm install --prefer-offline --no-audit && npm run dev -- --host"
    depends_on:
      - nginx
    networks:
      - tl_che_viet_network

  # ==========================================
  # Backend App (Laravel PHP-FPM)
  # ==========================================
  app:
    build:
      context: ./be
      dockerfile: docker/php/Dockerfile
    container_name: tl_che_viet_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./be:/var/www
      - ./be/docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - tl_che_viet_network

  # ==========================================
  # Backend Web Server (Nginx)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: tl_che_viet_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./be:/var/www
      - ./be/docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - tl_che_viet_network
    depends_on:
      - app

  # ==========================================
  # Database (MySQL)
  # ==========================================
  db:
    image: mysql:8.0
    container_name: tl_che_viet_db
    restart: unless-stopped
    ports: []
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - tl_che_viet_network

  # ==========================================
  # Cache (Redis)
  # ==========================================
  redis:
    image: redis:alpine
    container_name: tl_che_viet_redis
    restart: unless-stopped
    ports: []
    volumes:
      - redisdata:/data
    networks:
      - tl_che_viet_network

networks:
  tl_che_viet_network:
    driver: bridge

volumes:
  node_modules:
  dbdata:
    driver: local
  redisdata:
    driver: local
