name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── Lint & Type Check (Web + Backend) ─────────────────────────────
  check:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check (Web)
        run: npm run typecheck --workspace=apps/web
      - name: Lint (Backend)
        run: npm run lint --workspace=apps/backend

  # ─── Deploy to VPS ──────────────────────────────────────────────────
  # Source-based deploy: the VPS pulls the latest source and rebuilds it in
  # place via infra/scripts/deploy.sh (see infra/docker-compose.prod.yml — the
  # prod stack mirrors dev but runs the built source). Requires on the VPS:
  # repo checked out at /srv/thanglongcheviet with a populated .env
  # (cp .env.example .env, fill in secrets/CORS). deploy.sh is idempotent.
  deploy:
    name: Deploy to VPS
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /srv/thanglongcheviet
            git fetch origin main
            git reset --hard origin/main
            ./infra/scripts/deploy.sh
            echo "✅ Deploy successful"
