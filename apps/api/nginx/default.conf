# Reverse proxy gộp FE (Nuxt) + Admin (Vue/Vite) + API (NestJS) về 1 domain/1 port.
#   /        → Nuxt        (web:3000)
#   /admin/  → Admin SPA   (admin:3002, vite base=/admin/)
#   /api/    → NestJS API  (api:3001, giữ nguyên prefix /api)
#   /uploads/→ ảnh upload do NestJS phục vụ
# Hỗ trợ WebSocket (HMR dev của Vite/Nuxt).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 20m; # đủ lớn cho upload ảnh

  # Header dùng chung cho mọi proxy_pass bên dưới.
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  # API NestJS (global prefix /api được giữ nguyên).
  location /api/ {
    proxy_pass http://api:3001;
  }

  # Ảnh upload (NestJS serve tĩnh tại /uploads).
  location /uploads/ {
    proxy_pass http://api:3001;
  }

  # Admin SPA — chuyển /admin → /admin/ rồi proxy nguyên path (vite base=/admin/).
  location = /admin {
    return 301 /admin/;
  }
  location /admin/ {
    proxy_pass http://admin:3002;
  }

  # Frontend Nuxt (mặc định).
  location / {
    proxy_pass http://web:3000;
  }
}
