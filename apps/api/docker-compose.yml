# ==========================================================================
# Hạ tầng TEST cho NestJS API (apps/api) — migration từ Laravel.
# KHÔNG bao gồm service của project Laravel cũ (app/queue/scheduler/nginx/mysql/web).
#
# Dùng:
#   # CHỈ hạ tầng (để chạy app bằng pnpm dev ở host):
#   docker compose -f apps/api/docker-compose.yml up -d
#   # FULL trong Docker (hạ tầng + API NestJS + Web Nuxt):
#   docker compose -f apps/api/docker-compose.yml --profile apps up
#   # kèm S3 giả lập:  thêm  --profile s3
#   docker compose -f apps/api/docker-compose.yml down            # dừng (giữ data)
#   docker compose -f apps/api/docker-compose.yml down -v         # dừng + xoá data
#
# Cổng: Web 3000, API 3001, Postgres 5432, Redis 6379, Mailpit 8025/1025, LocalStack 4566.
# Ghi chú: api/web chạy trong container Linux với node_modules ở VOLUME riêng →
# không đụng node_modules win32/ext4 của host (hết lỗi lệch binary WSL/Windows).
# ==========================================================================

name: tl-api-dev

services:
  # ── PostgreSQL (đích migration) ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tl_api_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: thanglongcheviet
    volumes:
      - api_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thanglongcheviet"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tl_api_net

  # ── Redis (cache / rate-limit) ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tl_api_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - api_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tl_api_net

  # ── Mailpit (SMTP giả lập — cần cho mail Phase 6+) ──────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: tl_api_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP
    networks:
      - tl_api_net

  # ── LocalStack (S3 giả lập — opt-in qua profile "s3") ───────────────────
  # Để dùng: set trong apps/api/.env →
  #   AWS_S3_ENDPOINT=http://localhost:4566
  #   AWS_S3_FORCE_PATH_STYLE=true
  #   AWS_ACCESS_KEY_ID=test / AWS_SECRET_ACCESS_KEY=test
  localstack:
    image: localstack/localstack:latest
    container_name: tl_api_localstack
    profiles: ["s3"]
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEBUG: "0"
    volumes:
      - api_localstack:/var/lib/localstack
    networks:
      - tl_api_net

  # ── Backend NestJS (profile "apps") ─────────────────────────────────────
  api:
    image: node:20-bookworm-slim
    container_name: tl_api_be
    profiles: ["apps"]
    working_dir: /workspace
    # cài deps → đẩy schema → seed admin → chạy watch
    command: >
      sh -c "corepack enable &&
             pnpm install &&
             pnpm --filter @thang-long/api exec prisma db push --accept-data-loss &&
             pnpm --filter @thang-long/api seed:admin &&
             pnpm --filter @thang-long/api dev"
    environment:
      NODE_ENV: development
      PORT: "3001"
      CORS_ORIGIN: http://localhost:3000
      STOREFRONT_FRONTEND_URL: http://localhost:3000
      # URL công khai (qua nginx) để link ảnh upload trỏ đúng domain gộp.
      API_PUBLIC_URL: http://localhost:8080
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/thanglongcheviet?schema=public
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      ADMIN_COOKIE_SECRET: thang-long-che-viet-admin-secret-change-me-32chars
      # Bind-mount Docker → bật polling để nest --watch tự build lại khi sửa code.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    volumes:
      - ../../:/workspace
      - tl_root_modules:/workspace/node_modules
      - tl_api_modules:/workspace/apps/api/node_modules
      - tl_web_modules:/workspace/apps/web/node_modules
    ports:
      - "3001:3001"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 150s
    networks:
      - tl_api_net

  # ── Frontend Nuxt (profile "apps") ──────────────────────────────────────
  web:
    image: node:20-bookworm-slim
    container_name: tl_api_web
    profiles: ["apps"]
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm --filter web dev"
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      NUXT_API_PROXY_TARGET: http://api:3001
      NUXT_PUBLIC_SITE_URL: http://localhost:3000
      # Tự reload khi sửa code qua bind-mount Docker.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    volumes:
      - ../../:/workspace
      - tl_root_modules:/workspace/node_modules
      - tl_api_modules:/workspace/apps/api/node_modules
      - tl_web_modules:/workspace/apps/web/node_modules
    ports:
      - "3000:3000"
    depends_on:
      api: { condition: service_healthy }
    networks:
      - tl_api_net

  # ── Admin SPA React (Refine + Tailwind, profile "apps") ─────────────────
  admin:
    image: node:20-bookworm-slim
    container_name: tl_api_admin
    profiles: ["apps"]
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm --filter admin dev -- --host"
    environment:
      # Gọi API cùng origin qua '/api' (nginx định tuyến về NestJS) → 1 domain, khỏi CORS.
      VITE_API_URL: /api
      # Truy cập qua nginx (cổng 8080) → HMR client nối về cổng public 8080.
      VITE_HMR_CLIENT_PORT: "8080"
      # Đích proxy /api của vite khi truy cập trực tiếp :3002 (trong mạng Docker).
      VITE_API_PROXY: http://api:3001
      # Bind-mount Docker không bắn inotify → polling để tự reload khi sửa code.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    volumes:
      - ../../:/workspace
      - tl_root_modules:/workspace/node_modules
      - tl_admin_modules:/workspace/apps/admin/node_modules
    ports:
      - "3002:3002"
    depends_on:
      api: { condition: service_healthy }
    networks:
      - tl_api_net

  # ── Reverse proxy gộp FE + Admin + API về 1 domain/1 cổng (profile "apps") ──
  # Truy cập DUY NHẤT qua đây:
  #   http://localhost:8080/        → FE (Nuxt)
  #   http://localhost:8080/admin   → Admin
  #   http://localhost:8080/api     → API (Swagger: /api/docs)
  nginx:
    image: nginx:1.27-alpine
    container_name: tl_api_nginx
    profiles: ["apps"]
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
      - admin
    networks:
      - tl_api_net

networks:
  tl_api_net:
    driver: bridge

volumes:
  api_pgdata:
  api_redisdata:
  api_localstack:
  tl_root_modules:
  tl_api_modules:
  tl_web_modules:
  tl_admin_modules:
