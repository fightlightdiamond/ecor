# Bootstrap config — HTTP only, no `ssl_certificate` reference. nginx refuses
# to start at all if salon.conf's referenced cert files don't exist yet, so
# the very first deploy (before certbot has ever run) must use THIS file
# instead. infra/scripts/deploy.sh copies whichever config is appropriate
# into infra/nginx/active/ (the directory actually mounted into the nginx
# container) and switches to salon.conf once a real certificate exists.
#
# Serves the real site over plain HTTP too (not just the ACME challenge), so
# the domain already works during the short bootstrap window before HTTPS is
# up. Duplicates salon.conf's proxy locations on purpose — two independent,
# fully-readable files beat one clever shared-include that's harder to debug
# when something inevitably goes wrong at 2am on a VPS.

resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name thanglongcheviet.vn www.thanglongcheviet.vn;

    client_max_body_size 20m;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Medusa backend — internal CMS/admin. See salon.conf for the same
    # routing once HTTPS is active.
    location /app/ {
        set $backend_upstream http://backend:9000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        set $backend_upstream http://backend:9000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /store/ {
        set $backend_upstream http://backend:9000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
