# Preserve the original protocol from any upstream TLS proxy (see the same map
# in conf.d/default.conf for the full rationale — needed for Medusa's Secure
# admin session cookie). Falls back to $scheme when there's no upstream proxy.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "~.+"   $http_x_forwarded_proto;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name thanglongcheviet.vn www.thanglongcheviet.vn;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name thanglongcheviet.vn www.thanglongcheviet.vn;

    ssl_certificate     /etc/letsencrypt/live/thanglongcheviet.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thanglongcheviet.vn/privkey.pem;

    # SSL security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Resolve `backend` at request time via Docker's embedded DNS instead of
    # once at startup, so nginx keeps working after `backend` restarts and
    # gets a new container IP (a static proxy_pass would cache the old one).
    resolver 127.0.0.11 valid=10s;

    # Static assets — cache 1 year
    location ~* \.(js|css|woff2|woff|ttf|ico|png|jpg|jpeg|webp|avif|svg)$ {
        proxy_pass http://web:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 365d;
    }

    # Medusa backend — internal CMS/admin, not a customer-facing site. Kept on
    # the same domain+port as apps/web (see infra/nginx/conf.d/default.conf
    # for the dev equivalent) so admin dashboard + APIs are same-origin.
    location /app/ {
        set $backend_upstream http://backend:9000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /admin/ {
        set $backend_upstream http://backend:9000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /store/ {
        set $backend_upstream http://backend:9000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Medusa authentication (e.g. POST /auth/user/emailpass,
    # /auth/customer/emailpass) — also part of the backend API.
    location /auth/ {
        set $backend_upstream http://backend:9000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Remaining Medusa backend prefixes (full set: admin, auth, store, cloud,
    # hooks). /cloud is polled by the admin dashboard; /hooks handles payment
    # provider webhooks.
    location /cloud/ {
        set $backend_upstream http://backend:9000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /hooks/ {
        set $backend_upstream http://backend:9000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Proxy to Nuxt
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
