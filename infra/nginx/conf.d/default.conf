# Dev entrypoint — single port (80), no domain/SSL. Fronts every service on
# one origin so the browser (and apps/web's SSR calls) never need CORS:
#   /app/, /admin/, /store/, /health  -> Medusa backend (internal CMS + API)
#   everything else                   -> Nuxt web (apps/web)
#
# Production uses nginx/sites/salon.conf instead (real domain + TLS), with
# the same routing rules.

# `backend` lives in a different compose project (root docker-compose.yml)
# with no start-order guarantee here, so resolve it at request time via
# Docker's embedded DNS instead of once at nginx startup — otherwise nginx
# refuses to start if `backend` isn't resolvable yet.
resolver 127.0.0.11 valid=10s;

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 20m;

    location /app/ {
        set $backend_upstream http://backend:9000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        set $backend_upstream http://backend:9000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /store/ {
        set $backend_upstream http://backend:9000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        set $backend_upstream http://backend:9000;
        proxy_pass $backend_upstream;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
