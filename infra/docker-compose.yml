# =============================================================================
# Thang Long Che Viet — full dev stack, single port
# =============================================================================

name: tlcv

services:
  postgres:
    image: postgres:15
    container_name: tlcv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-medusa}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-strapi-schema.sql:/docker-entrypoint-initdb.d/01-strapi-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-medusa}"]
      interval: 5s
      timeout: 5s
      retries: 12

  install:
    image: node:20
    container_name: tlcv_install
    working_dir: /workspace
    command: >
      sh -c "(npm install --no-audit --no-fund ||
              npm install --no-audit --no-fund --legacy-peer-deps) &&
             (cd /workspace/strapi && npm install --no-audit --no-fund ||
              cd /workspace/strapi && npm install --no-audit --no-fund --legacy-peer-deps)"
    volumes:
      - ../:/workspace
      - root_node_modules:/workspace/node_modules
      - backend_node_modules:/workspace/apps/backend/node_modules
      - storefront_node_modules:/workspace/apps/storefront/node_modules
      - strapi_node_modules:/workspace/strapi/node_modules
    restart: "no"

  backend:
    image: node:20
    container_name: tlcv_backend
    working_dir: /workspace/apps/backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      install:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-medusa}
      STORE_CORS: ${STORE_CORS:-http://localhost:80}
      ADMIN_CORS: ${ADMIN_CORS:-http://localhost:80}
      AUTH_CORS: ${AUTH_CORS:-http://localhost:80}
      JWT_SECRET: ${JWT_SECRET:-supersecret}
      COOKIE_SECRET: ${COOKIE_SECRET:-supersecret}
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL:-http://${DOMAIN:-localhost}:${HTTP_PORT:-80}}
      DOMAIN: ${DOMAIN:-localhost}
      DISABLE_ADMIN_HMR: ${DISABLE_ADMIN_HMR:-true}
      ENABLE_ADMIN_HMR: ${ENABLE_ADMIN_HMR:-false}
      ADMIN_FORCE_REBUILD: ${ADMIN_FORCE_REBUILD:-false}
      ADMIN_AUTH_TYPE: ${ADMIN_AUTH_TYPE:-jwt}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    volumes:
      - ../:/workspace
      - root_node_modules:/workspace/node_modules
      - backend_node_modules:/workspace/apps/backend/node_modules
      - backend_medusa:/workspace/apps/backend/.medusa
    command: >
      sh -c "npx medusa db:migrate &&
             (npx medusa exec ./src/scripts/seed-base.ts || true) &&
             (npx medusa exec ./src/scripts/seed-cards.ts || true) &&
             (npx medusa user -e ${ADMIN_EMAIL:-admin@medusa.local} -p ${ADMIN_PASSWORD:-supersecret123} || true) &&
             npx medusa develop"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s

  storefront:
    image: node:20
    container_name: tlcv_storefront
    working_dir: /workspace/apps/storefront
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      install:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      MEDUSA_BACKEND_URL: http://backend:9000
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://${DOMAIN:-localhost}:${HTTP_PORT:-80}
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-}
      NEXT_PUBLIC_MEDUSA_NAVIGATION_ID: ${NEXT_PUBLIC_MEDUSA_NAVIGATION_ID:-}
      NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-dk}
      NEXT_PUBLIC_BASE_URL: http://${DOMAIN:-localhost}:${HTTP_PORT:-80}
      NEXT_PUBLIC_STRIPE_KEY: ${NEXT_PUBLIC_STRIPE_KEY:-}
      NEXT_PUBLIC_STRAPI_API_URL: http://cms:1337
      WATCHPACK_POLLING: "true"
    volumes:
      - ../:/workspace
      - root_node_modules:/workspace/node_modules
      - storefront_node_modules:/workspace/apps/storefront/node_modules
      - storefront_next:/workspace/apps/storefront/.next
    command: sh -c "npx next dev -p 8000 -H 0.0.0.0"

  cms:
    image: node:20
    container_name: tlcv_cms
    working_dir: /workspace/strapi
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      install:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "1337"
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-medusa}
      DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_SCHEMA: strapi
      APP_KEYS: toBeModifiedLater1,toBeModifiedLater2
      API_TOKEN_SALT: defaultSaltForCmsApiToken
      ADMIN_JWT_SECRET: defaultJwtSecretForAdminCms
      TRANSFER_TOKEN_SALT: defaultTransferTokenSalt
      JWT_SECRET: defaultCmsJwtSecret
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@medusa.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-supersecret123}
      HTTP_PORT: ${HTTP_PORT:-80}
    volumes:
      - ../:/workspace
      - root_node_modules:/workspace/node_modules
      - strapi_node_modules:/workspace/strapi/node_modules
    command: sh -c "if [ ! -d dist ]; then npm run build; fi && npm run start"

  nginx:
    image: nginx:1.25-alpine
    container_name: tlcv_nginx
    restart: unless-stopped
    depends_on:
      storefront:
        condition: service_started
      backend:
        condition: service_healthy
      cms:
        condition: service_started
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro

volumes:
  postgres_data:
  root_node_modules:
  backend_node_modules:
  storefront_node_modules:
  backend_medusa:
  storefront_next:
  strapi_node_modules:
