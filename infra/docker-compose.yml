# =============================================================================
# infra — Nuxt web + single-port nginx entrypoint (dev)
# =============================================================================
# Runs apps/web (Nuxt) with hot-reload, fronted by nginx on ONE port so every
# service is reachable through the same host+port, matching the production
# layout (nginx/sites/salon.conf): one domain, one port, path-based routing.
#
# node_modules live in a NAMED VOLUME (ext4), not the bind mount, for the same
# reason as the root docker-compose.yml: source on /mnt/d is slow over 9p.
#
# The Medusa backend (root docker-compose.yml, a separate compose project) is
# treated as an internal CMS/admin service here, not a customer-facing site —
# nginx proxies its admin dashboard (/app) and APIs (/admin, /store) so
# apps/web can call them same-origin, but nothing about apps/web itself
# changes. apps/storefront (the Medusa Next.js storefront) is NOT routed here:
# it also wants "/", which collides with apps/web, so it stays reachable only
# on its own port (see root docker-compose.yml) until/unless it's given a
# `basePath` and a real reason to be public.
#
# Both compose projects join the same EXTERNAL network (tlcv_shared) so nginx
# can resolve `backend` by service name across projects. Create it once:
#   docker network create tlcv_shared
# (start.dev.sh / start.prod.sh at the repo root do this automatically, and
# start the Medusa stack before this one so `backend` exists before nginx
# tries to resolve it.)
#
# Run:
#   cd infra
#   docker compose up -d
#   # -> open http://localhost  (web at /, Medusa admin at /app)
# =============================================================================

name: tlcv-infra

services:
  # --- One-shot dependency install (whole npm workspace, populates volumes) --
  install:
    image: node:20
    working_dir: /workspace
    command: sh -c "npm install --no-audit --no-fund"
    volumes:
      - ../:/workspace
      - root_node_modules:/workspace/node_modules
      - web_node_modules:/workspace/apps/web/node_modules
    restart: "no"

  # --- Nuxt web (dev, hot-reload) ---------------------------------------------
  web:
    image: node:20
    container_name: tlcv_web
    working_dir: /workspace/apps/web
    restart: unless-stopped
    depends_on:
      install:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "3000"
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost}
      # Bind mount over 9p (WSL/Windows) doesn't emit inotify events.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    volumes:
      - ../:/workspace
      - root_node_modules:/workspace/node_modules
      - web_node_modules:/workspace/apps/web/node_modules
      - web_nuxt:/workspace/apps/web/.nuxt
      - web_output:/workspace/apps/web/.output
    # No published host port on purpose: nginx below is the single entrypoint.
    # Uncomment for direct debugging without going through nginx:
    # ports:
    #   - "3000:3000"
    command: sh -c "npm run dev -- --host 0.0.0.0 --port 3000"

  # --- nginx (single entrypoint, one port for every service) ------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: tlcv_nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Dev routing only (plain HTTP, no domain/SSL). Production uses
      # nginx/sites/salon.conf (real domain + certbot) via a separate
      # docker-compose.prod.yml instead of this conf.d directory.
      - ./nginx/conf.d:/etc/nginx/conf.d:ro

volumes:
  root_node_modules:
  web_node_modules:
  web_nuxt:
  web_output:

# Shared with the root docker-compose.yml (Medusa stack) — see comment above.
networks:
  default:
    name: tlcv_shared
    external: true
